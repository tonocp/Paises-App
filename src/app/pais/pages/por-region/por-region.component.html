<div class="animate__animated animate__fadeIn animate__faster">
  <h2>
    Buscar por Continente: <small> {{ regionActiva | titlecase }}</small>
  </h2>
  <hr />

  <h5>Seleccione el continente:</h5>

  <div class="row">
    <div class="col">
      @for (region of regiones; track region) {
        <button
          [class]="getClaseCSS(region)"
          (click)="activarRegion(region)"
          >
          {{ region | titlecase }}
        </button>
      }
    </div>
  </div>

  <hr />
</div>

@if (paises.length > 0) {
  <div class="row">
    <div class="col">
      <app-pais-tabla [paises]="paises"></app-pais-tabla>
    </div>
  </div>
}
